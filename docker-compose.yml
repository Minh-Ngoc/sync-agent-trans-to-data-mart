networks:
  sync-net:
    driver: bridge

services:
  sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: mongo-pg-sync:latest
    container_name: mongo-pg-sync

    # Day la job BATCH (chay xong roi thoat), KHONG PHAI service chay mai.
    # Vi vay KHONG dat restart: always/unless-stopped o day -- neu dat, Docker
    # se lien tuc restart job sau moi lan hoan thanh, tuong duong chay sync
    # lien tuc 24/7 vao production DB. Kich hoat theo lich bang cron/systemd
    # timer goi "docker compose run --rm sync" (xem README.md).
    restart: "no"

    env_file:
      - .env

    # ==== GIOI HAN TAI NGUYEN CUA CONTAINER =================================
    # Day la hang rao NGOAI CUNG, dam bao du script co bug/leak gi thi cung
    # KHONG the chiem het CPU/RAM cua host va anh huong cac service khac.
    # Diem tham chieu: mac dinh script chay WORKER_COUNT=4 worker thread,
    # moi worker gioi han heap ~512MB (WORKER_MAX_OLD_GEN_MB trong .env).
    # Neu tang WORKER_COUNT hoac WORKER_MAX_OLD_GEN_MB, phai tang mem_limit
    # tuong ung (cong thuc tho: mem_limit >= (WORKER_COUNT + 1) x WORKER_MAX_OLD_GEN_MB x 1.3).
    mem_limit: 1200m
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 512

    # tini (entrypoint trong Dockerfile) forward SIGINT/SIGTERM dung cach,
    # nhung van can noi them thoi gian cho tien trinh tu dung "an toan"
    # (dang cho 1 batch dang COPY/UPSERT/COMMIT xong) truoc khi Docker
    # gui SIGKILL. Mac dinh Docker la 10s -- qua ngan cho 1 batch lon dang
    # ghi Postgres, nen keo dai ra de tranh mat/rollback batch dang chay.
    stop_grace_period: 60s

    # Gioi han dung luong log tren disk (job nay co the chay lau, in nhieu dong
    # log tien do) -- tranh log rotation mac dinh khong gioi han lam day disk
    # host va gian tiep "anh huong ca server".
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sync-net

    # Cho phep container goi toi "host.docker.internal" tro ve chinh host
    # Linux dang chay Docker (macOS/Windows Docker Desktop da co san).
    # Huu ich khi MongoDB/Postgres production chay ngay tren host nay,
    # ngoai Docker. Bo qua neu MONGO_URI/PG_HOST da la IP/hostname mang that.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      